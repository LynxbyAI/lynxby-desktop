[workspace]
resolver = "2"
members = ["crates/lynxby-client", "crates/lynxby-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json", "platform-verifier"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
dirs = "6"

# gpui 0.2.2 pulls xattr 0.2, which no longer compiles against libc >= 0.2.175.
libc = "=0.2.174"
gpui = "0.2.2"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2
