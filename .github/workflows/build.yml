name: Build

# Checking happens on every push and pull request. A tag publishes the three
# binaries as a release, which is where the download links on lynxby.com point.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-latest
            artifact: lynxby-desktop-linux-x86_64
            binary: lynxby-desktop
          - platform: Windows x86_64
            os: windows-latest
            artifact: lynxby-desktop-windows-x86_64
            binary: lynxby-desktop.exe
          - platform: macOS arm64
            os: macos-latest
            artifact: lynxby-desktop-macos-arm64
            binary: lynxby-desktop

    steps:
      - uses: actions/checkout@v4

      - name: System libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p lynxby-desktop

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name them per platform
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/lynxby-desktop-linux-x86_64/lynxby-desktop release/lynxby-desktop-linux-x86_64
          cp dist/lynxby-desktop-windows-x86_64/lynxby-desktop.exe release/lynxby-desktop-windows-x86_64.exe
          cp dist/lynxby-desktop-macos-arm64/lynxby-desktop release/lynxby-desktop-macos-arm64
          chmod +x release/*
          (cd release && sha256sum ./* > SHA256SUMS)
          ls -l release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "The Lynxby desktop app for Linux, Windows and macOS. Run the file; it asks you to sign in to your deployment in your browser. Builds are unsigned and there is no installer yet." \
            --verify-tag
